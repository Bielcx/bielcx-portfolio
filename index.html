<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />

    <!-- O mesmo do portfólio web3 (`web3/app/icon.png`): 128x128, o retrato
         recortado em círculo. Os dois sites são a mesma pessoa, e na aba é o
         rosto que identifica isso mais rápido que qualquer letra. Trocou lá,
         troque aqui — são dois repositórios, e o arquivo é copiado à mão. -->
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />

    <!-- O `title` é o TEXTO CLICÁVEL do resultado de busca, e não só o rótulo
         da aba — foi só "Gabriel Cavalcanti" por um tempo, medindo os ~20
         caracteres da aba quando na busca cabem uns 60.

         O que vem depois do nome é "desenvolvedor full stack", e NÃO uma versão
         com palavra-chave ("desenvolvedor de sites e automação"), que chegou a
         estar aqui. A razão é que este site é divulgado por LINK, não por busca
         orgânica: quem chega vem de uma conversa, e o que o título precisa ser é
         igual ao `og:title`, ao `jobTitle` do JSON-LD e à primeira linha da
         seção 02. Um portfólio pessoal sem conteúdo recorrente não disputa
         "criar site" no Google; disputa parecer a mesma pessoa em todo lugar.

         As palavras que alguém buscaria estão na `description`, que é o texto
         embaixo do título no resultado. -->
    <title>Gabriel Cavalcanti — desenvolvedor full stack</title>
    <meta
      name="description"
      content="Desenvolvedor full stack. Sites, lojas virtuais, painéis e automação para empresas — do orçamento ao site no ar, falando direto com quem constrói."
    />

    <!-- A URL do deploy, absoluta, e ela aparece em SEIS lugares acoplados:
         este `canonical`, o `og:url`, o `og:image`, o `url` do JSON-LD, o
         `Sitemap:` do `public/robots.txt` e o `<loc>` do `public/sitemap.xml`.
         Trocar num sem trocar nos outros é erro silencioso — o site continua
         no ar e só o preview de link e a indexação quebram.

         Ela já esteve em `gabriel-comercial.vercel.app`, que nunca existiu: o
         `og:image` apontava para um 404 e o `canonical` mandava o Google para
         um domínio inexistente.

         Hoje é `gabriel.doabridge.com`, um subdomínio do domínio da bridge —
         escolhido por ser de graça. O `bielcx-portfolio.vercel.app` continua
         servindo a mesma página, e é justamente por isso que o `canonical`
         aponta para o subdomínio: com dois endereços servindo o mesmo
         conteúdo, ele é quem diz qual é o oficial.

         TODO: domínio próprio. **Enquanto for este, o site depende de um
         domínio que existe para outra coisa** — se a bridge sair do ar ou o
         domínio mudar de dono, todo link já divulgado morre junto. -->
    <link rel="canonical" href="https://gabriel.doabridge.com/" />

    <!-- Preview de link (WhatsApp, LinkedIn, Slack). Esses robôs não executam
         JavaScript: o que eles mostram sai daqui, não da página renderizada.

         `public/og.jpg` é um print do hero em 1200x630, gerado à mão. JPEG e
         não PNG porque o WhatsApp costuma desistir do preview acima de uns
         300 KB — houve aqui um `OGimage.png` de 318 KB que NUNCA foi usado,
         porque o nome não batia com o que esta linha pede: o preview colava
         vazio e nada acusava. **O nome do arquivo e esta URL são um par.** -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gabriel Cavalcanti" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://gabriel.doabridge.com/" />
    <meta property="og:title" content="Gabriel Cavalcanti — desenvolvedor full stack" />
    <meta
      property="og:description"
      content="Sites, lojas virtuais, painéis e automação para empresas. Do orçamento ao site no ar, falando direto com quem constrói."
    />
    <meta property="og:image" content="https://gabriel.doabridge.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Gabriel Cavalcanti — desenvolvedor full stack" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gabriel Cavalcanti",
        "url": "https://gabriel.doabridge.com/",
        "jobTitle": "Desenvolvedor full stack",
        "description": "Sites, lojas virtuais, painéis e automação para empresas.",
        "email": "biel.cavalcanti1@hotmail.com",
        "address": { "@type": "PostalAddress", "addressCountry": "BR" },
        "sameAs": [
          "https://github.com/Bielcx",
          "https://www.linkedin.com/in/gabrielcavalcanti-dev"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
